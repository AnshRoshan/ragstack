services:
  ragstack:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./.ragstack:/app/.ragstack
      - hf-cache:/root/.cache
    environment:
      # pick your stack mode in ragstack.yaml; keys pass through if using cloud/hybrid
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - RAGSTACK_AUTH_TOKEN=${RAGSTACK_AUTH_TOKEN:-}
  neo4j:
    image: neo4j:5
    profile: ["neo4j"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
    volumes:
      - neo4j-data:/data

volumes:
  hf-cache:
  neo4j-data:
